<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog · Kevin Valerio</title>
  <meta name="description" content="Security research notes and blog articles by Kevin Valerio.">
  <meta name="theme-color" content="#fdfcfa">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23b4552d'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='%23fdfcfa' font-family='Georgia,serif'%3Ekv%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark';</script>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

<nav class="nav" aria-label="Site">
  <div class="nav-inner">
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="./" class="active" aria-current="page">Blog</a></li>
    </ul>
    <button id="theme-toggle" class="theme-btn" type="button" aria-label="Toggle dark theme">dark</button>
  </div>
</nav>

<main class="post">
  <header class="post-head">
    <h1>Blog</h1>
    <p class="post-dek">Security research notes.</p>
  </header>
  <ul class="entries compact">
    <li>
      <span class="e-year">Nov 2026</span>
      <p class="e-line"><a href="l50s-pro-ultra-camera-pin.html">Tracing the L50s Pro Ultra camera PIN</a></p>
    </li>
  </ul>
</main>

<script>
  const themeBtn = document.getElementById('theme-toggle');
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  function syncTheme() {
    const dark = document.documentElement.dataset.theme === 'dark';
    themeBtn.textContent = dark ? 'light' : 'dark';
    themeMeta.content = dark ? '#161514' : '#fdfcfa';
  }
  themeBtn.addEventListener('click', () => {
    if (document.documentElement.dataset.theme === 'dark') {
      delete document.documentElement.dataset.theme;
      localStorage.removeItem('theme');
    } else {
      document.documentElement.dataset.theme = 'dark';
      localStorage.setItem('theme', 'dark');
    }
    syncTheme();
  });
  syncTheme();
</script>

</body>
</html>
